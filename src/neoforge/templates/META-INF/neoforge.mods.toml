    type="required"
    versionRange="[${minecraft}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.cinematic_tacz]]
    modId="cinematic"
    type="required"
    versionRange="[0.18.30,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.cinematic_tacz]]
    modId="tacz"
    type="required"
    versionRange="${tacz}"
    ordering="AFTER"
    side="BOTH"
