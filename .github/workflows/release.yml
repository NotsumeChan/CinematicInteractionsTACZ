# Builds the add-on (every Stonecutter node) on main and publishes the JARs as a release "v<mod_version>" (gradle.properties); skipped when that version is already released
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Cinematic Interactions is not on any maven: its JARs (one per target, the ones our nodes use) are built from this
  # commit. Keep it in step with cinematic_jar in versions/<node>/gradle.properties.
  # The owner's fork, where its 1.20.1-forge target builds on GitHub's runners (not yet merged into dcvke's main).
  CINEMATIC_REPO: chomusuke-png/CinematicInteractions
  CINEMATIC_COMMIT: e1d9ff1
  # The nodes released (each built against Cinematic Interactions' target of the same name)
  CINEMATIC_TARGETS: 1.20.1-fabric 1.21.1-fabric 1.21.1-neoforge 1.20.1-forge
  # Nodes built against a version of Cinematic Interactions' multiversion/ project (Fabric 26.1+): <node>=<version>
  MULTIVERSION_TARGETS: 26.1.2-fabric=26.1.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 1.20.1 targets build with 17 (Cinematic Interactions' toolchain), 26.1+ with 25, the rest and Gradle itself with 21
          java-version: |
            17
            25
            21

      # this repo does not track the Gradle wrapper
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build Cinematic Interactions (host JAR)
        run: |
          git clone --filter=blob:none "https://github.com/$CINEMATIC_REPO.git" "$RUNNER_TEMP/cinematic"
          cd "$RUNNER_TEMP/cinematic"
          git checkout "$CINEMATIC_COMMIT"
          sh gradlew $(for t in $CINEMATIC_TARGETS; do echo ":$t:build"; done) -x test --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/libs"
          for t in $CINEMATIC_TARGETS; do
            jar=$(grep '^cinematic_jar=' "$GITHUB_WORKSPACE/versions/$t/gradle.properties" | cut -d= -f2)
            cp "versions/$t/build/libs/$jar" "$GITHUB_WORKSPACE/libs/"
          done
          # its 26.1+ versions, with Java 25
          cd multiversion
          JAVA_HOME="$JAVA_HOME_25_X64" sh gradlew $(for t in $MULTIVERSION_TARGETS; do echo ":${t#*=}:build"; done) -x test --no-daemon
          for t in $MULTIVERSION_TARGETS; do
            jar=$(grep '^cinematic_jar=' "$GITHUB_WORKSPACE/versions/${t%%=*}/gradle.properties" | cut -d= -f2)
            cp "versions/${t#*=}/build/libs/$jar" "$GITHUB_WORKSPACE/libs/"
          done

      # TACZ ports that are only on GitHub (tacz_jar and tacz_url in the node's gradle.properties)
      - name: Download TACZ JARs
        run: |
          for props in versions/*/gradle.properties; do
            url=$(grep '^tacz_url=' "$props" | cut -d= -f2-)
            [ -n "$url" ] || continue
            curl -sSfL "$url" -o "libs/$(grep '^tacz_jar=' "$props" | cut -d= -f2-)"
          done

      - name: Build add-on
        run: gradle $(for t in $CINEMATIC_TARGETS ${MULTIVERSION_TARGETS}; do echo ":${t%%=*}:build"; done) --no-daemon

      - name: Publish release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::notice::v$version is already released; bump mod_version to publish a new one"
            exit 0
          fi
          gh release create "v$version" versions/*/build/libs/*.jar --target "$GITHUB_SHA" \
            --title "v$version" --generate-notes
