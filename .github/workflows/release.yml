# Builds the add-on on nightly and main and publishes the JAR:
# - nightly: a rolling pre-release under the tag "nightly", replaced on every push
# - main: a release "v<mod_version>" (gradle.properties); skipped when that version is already released
name: Release

on:
  push:
    branches: [nightly, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Cinematic Interactions is not on any maven: its Fabric 1.21.1 JAR is built from this commit.
  # Keep it in step with cinematic_jar in gradle.properties.
  CINEMATIC_REPO: dcvke/CinematicInteractions
  CINEMATIC_COMMIT: 8a6d9c0
  # Its build needs Polymorph's API (git-ignored in its repo): Polymorph 1.1.0+1.21.1 from Modrinth.
  POLYMORPH_URL: https://cdn.modrinth.com/data/tagwiZkJ/versions/Ng5Y6KVo/polymorph-fabric-1.1.0%2B1.21.1.jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # this repo does not track the Gradle wrapper
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build Cinematic Interactions (host JAR)
        run: |
          git clone --filter=blob:none "https://github.com/$CINEMATIC_REPO.git" "$RUNNER_TEMP/cinematic"
          cd "$RUNNER_TEMP/cinematic"
          git checkout "$CINEMATIC_COMMIT"
          cd fabric/1.21.1
          mkdir -p test-mods/polymorph
          curl -fsSL -o test-mods/polymorph/polymorph-fabric-1.1.0+1.21.1.jar "$POLYMORPH_URL"
          sh gradlew remapJar --no-daemon
          jar=$(grep '^cinematic_jar=' "$GITHUB_WORKSPACE/gradle.properties" | cut -d= -f2)
          mkdir -p "$GITHUB_WORKSPACE/libs"
          cp build/libs/*-Fabric-1.21.1-*.jar "$GITHUB_WORKSPACE/libs/$jar"

      - name: Build add-on
        run: gradle build --no-daemon

      - name: Publish nightly
        if: github.ref_name == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly versions/*/build/libs/*.jar --prerelease --target "$GITHUB_SHA" \
            --title "Nightly ($(git rev-parse --short HEAD))" \
            --notes "Untested build of \`nightly\` at $GITHUB_SHA. Replaced on every push."

      - name: Publish release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::notice::v$version is already released; bump mod_version to publish a new one"
            exit 0
          fi
          gh release create "v$version" versions/*/build/libs/*.jar --target "$GITHUB_SHA" \
            --title "v$version" --generate-notes
