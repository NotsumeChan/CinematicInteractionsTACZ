pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    // the Forge node runs on Java 17: Gradle fetches one into its own folder (~/.gradle/jdks) when none is found
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Stonecutter: one codebase, one node per Minecraft version and loader, named <minecraft>-<loader> as Cinematic
// Interactions' are. Each node is built by build.<loader>.gradle in versions/<node>/, with its own values in
// versions/<node>/gradle.properties; code that differs between nodes sits behind //? comments. The active node is set in
// stonecutter.gradle.
stonecutter {
    create(rootProject) {
        // build.<loader>.gradle builds each
        [['1.21.1', 'fabric'], ['1.20.1', 'fabric'], ['1.21.1', 'neoforge'], ['1.20.1', 'forge']].each { minecraft, loader ->
            version("$minecraft-$loader", minecraft).buildscript = "build.${loader}.gradle"
        }
        // the code written out in src/
        vcsVersion = '1.21.1-fabric'
    }
}

rootProject.name = 'cinematic-tacz'
