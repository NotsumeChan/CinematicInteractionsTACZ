plugins {
    id 'fabric-loom' version '1.16.3'
}

version = mod_version
group = 'dev.notsume.cinematictacz'
base.archivesName = 'CinematicInteractions-TACZ-Fabric-1.21.1'

repositories {
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.terraformersmc.com/releases/'; content { includeGroup 'com.terraformersmc' } }
}

configurations {
    hostMods { transitive = false }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang names with Parchment parameters, as Cinematic Interactions uses (TACZ's own Yarn names are remapped by Loom).
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Never bundled: players install the hosts themselves.
    modImplementation files(rootProject.file("libs/${cinematic_jar}"))
    modCompileOnly "maven.modrinth:tacz-refabricated:${tacz_version}"
    modCompileOnly "maven.modrinth:forge-config-api-port:${fcap_version}"
    hostMods "maven.modrinth:tacz-refabricated:${tacz_version}"
    hostMods "maven.modrinth:forge-config-api-port:${fcap_version}"
    // optional: the settings button in its mods list (in the dev runs too, to reach the settings screen)
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    runs {
        // one game folder for every node (runDir is relative to versions/<node>/)
        client { client(); runDir '../../run/client' }
        server { server(); runDir '../../run/server'; programArg '--nogui' }
    }
}

// TACZ and Forge Config API Port carry nested libraries (night-config, LuaJ ...) that a dev classpath does not unpack:
// the dev runs load their real JARs from mods/, as a player's game does.
['client', 'server'].each { side ->
    def copyHosts = tasks.register("${side}HostMods", Copy) {
        from configurations.hostMods
        into rootProject.file("run/${side}/mods")
    }
    tasks.matching { it.name == "run${side.capitalize()}" }.configureEach { dependsOn copyHosts }
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand version: version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
