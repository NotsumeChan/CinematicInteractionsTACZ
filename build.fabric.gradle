// The Fabric nodes, with Loom: the remapping one for the obfuscated versions, the plain one from 26.1 on (same JAR).
plugins {
    id 'fabric-loom' version '1.17.21' apply false
}

def mcVersion = stonecutter.current.version
def javaVersion = java_version as int
def unobfuscated = stonecutter.eval(mcVersion, '>=26.1')
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'fabric-loom'
// the plain Loom has no mod* configurations: nothing to remap
def mod = { String name -> unobfuscated ? name : 'mod' + name.capitalize() }
// TaCZ Refabricated from Modrinth, or a JAR in libs/ where it is only on GitHub
def tacz = project.hasProperty('tacz_jar') ? files(rootProject.file("libs/${tacz_jar}")) : "maven.modrinth:tacz-refabricated:${tacz_version}"

version = mod_version
group = 'dev.notsume.cinematictacz'
base.archivesName = "CinematicInteractions-TACZ-Fabric-${mcVersion}"

repositories {
    maven { url = 'https://maven.parchmentmc.org/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.terraformersmc.com/releases/'; content { includeGroup 'com.terraformersmc' } }
}

configurations {
    hostMods { transitive = false }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    // Mojang names with Parchment parameters, as Cinematic Interactions uses (TACZ's own Yarn names are remapped by Loom).
    // 26.1+ ships with Mojang's names already.
    if (!unobfuscated) mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${mcVersion}:${parchment_mappings_version}@zip")
    }
    "${mod('implementation')}" "net.fabricmc:fabric-loader:${loader_version}"
    "${mod('implementation')}" "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Never bundled: players install the hosts themselves.
    "${mod('implementation')}" files(rootProject.file("libs/${cinematic_jar}"))
    "${mod('compileOnly')}" tacz
    "${mod('compileOnly')}" "maven.modrinth:forge-config-api-port:${fcap_version}"
    hostMods tacz
    hostMods "maven.modrinth:forge-config-api-port:${fcap_version}"
    // optional: the settings button in its mods list (in the dev runs too, to reach the settings screen)
    "${mod('compileOnly')}" "com.terraformersmc:modmenu:${modmenu_version}"
    "${mod('localRuntime')}" "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    runs {
        // one game folder for every node (runDir is relative to versions/<node>/)
        client { client(); runDir "../../run/${stonecutter.current.project}/client" }
        server { server(); runDir "../../run/${stonecutter.current.project}/server"; programArg '--nogui' }
    }
}

// TACZ and Forge Config API Port carry nested libraries (night-config, LuaJ ...) that a dev classpath does not unpack:
// the dev runs load their real JARs from mods/, as a player's game does.
['client', 'server'].each { side ->
    def copyHosts = tasks.register("${side}HostMods", Copy) {
        from configurations.hostMods
        into rootProject.file("run/${stonecutter.current.project}/${side}/mods")
    }
    tasks.matching { it.name == "run${side.capitalize()}" }.configureEach { dependsOn copyHosts }
}

sourceSets.main.resources.srcDir rootProject.file('src/fabric/resources')

processResources {
    def props = [version: version, minecraft: mcVersion, java: javaVersion,
                 tacz: project.findProperty('tacz_range') ?: '>=0.7.1-alpha <0.8.0-alpha']
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
    // mixins a node does without (mixins_exclude in its gradle.properties) are left out of the list
    def excluded = (project.findProperty('mixins_exclude') ?: '').tokenize(',')
    inputs.property 'mixinsExcluded', excluded
    filesMatching('cinematic_tacz.mixins.json') {
        filter { line -> excluded.inject(line) { kept, mixin -> kept.replace("\"${mixin}\", ", '') } }
    }
}

// 26.1+ needs Java 25, newer than the one running Gradle
if (javaVersion > 21) java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
}
